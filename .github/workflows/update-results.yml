name: Update results

# Draws happen at 2 PM, 5 PM and 9 PM Manila time (UTC+8), and the free results feed posts them
# with a delay of a few hours. Checking every 3 hours catches them soon after they appear, and a
# run with nothing new finishes in about a minute. It can also be started by hand from the Actions tab.
on:
  schedule:
    - cron: "10 */3 * * *"   # every 3 hours, at :10 past (UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-results
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install only what the update needs
        run: pip install pandas numpy requests scikit-learn

      - name: Fetch new results, score old picks, log new picks
        run: python scripts/update_results.py --no-xlsx

      - name: Commit changes (Streamlit Cloud redeploys and retrains on its own)
        run: |
          git add data/draws.csv.gz data/pick_log.csv
          if git diff --cached --quiet; then
            echo "Nothing new."
          else
            git config user.name "lotto-bot"
            git config user.email "lotto-bot@users.noreply.github.com"
            git commit -m "Add new results and update pick log"
            git pull --rebase
            git push
          fi
